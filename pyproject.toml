[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabulary-learning-website"
version = "0.2.0"
description = "A local Windows vocabulary learning application"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.gui-scripts]
vocabulary-learning = "vocabulary_app.__main__:main"

[tool.setuptools.packages.find]
include = ["vocabulary_app*"]

[tool.setuptools.package-data]
vocabulary_app = ["resources/*.json", "resources/licenses/*"]

